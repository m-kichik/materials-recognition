PROJECT_NAME: "MATERIALS"
EXPERIMENT_NAME: "clip-base-siglip"
MODEL:
  TYPE: "vanilla_clip"
  CLIP_BACKBONE: "google/siglip2-base-patch32-256"
TRAIN:
  PRETRAINED: True
  BATCH_SIZE: 512
  NUM_WORKERS: 4
  FREEZE_TEXT: False
  ADD_MATERIALS_PREFIX: False
  CLIP_LR: True
  WARMUP: 0.1
  GRADIENT_ACCUMULATION_STEPS: 1
  LR: 5e-6
  CRITERION: "CLIP"
  # TEMPERATURE: 0.07
  TEMPERATURE: 0.42
  TEMP_LR: 1e-4
  ITERS: 20000
  EVAL_INTERVAL: 1000
  IMAGES_PATH: "/home/docker_user/datasets/train2017_cropped_blurred_pad_small"
  CAPTIONS_PATH: "/home/docker_user/datasets/captions/train_base_anno.json"
  CAPTION_KEY: "caption"
  WANDB: False
EVAL:
  BATCH_SIZE: 64
  NUM_WORKERS: 4
  IMAGES_PATH: "/home/docker_user/datasets/val2017_cropped_blurred_pad_small"
  CAPTIONS_PATH: "/home/docker_user/datasets/captions/val_base_anno.json"
